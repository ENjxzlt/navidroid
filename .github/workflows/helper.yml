name: Helper image

# Baut das Docker-Image des YouTube-Helfers und veröffentlicht es in der GitHub Container Registry.
on:
  push:
    branches: [main]
    paths: ["helper/**", ".github/workflows/helper.yml"]
  schedule:
    - cron: "0 4 * * 1"   # wöchentlich neu bauen, damit yt-dlp aktuell bleibt
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests
        run: |
          python3 helper/tests/test_matching.py
          python3 helper/tests/test_audiobooks.py
          python3 helper/tests/test_videos.py

      - name: Image startet (alle Module enthalten)
        run: |
          docker build -q -t helper-check helper
          docker run --rm -e HELPER_TOKEN=t -e LIDARR_URL=http://x -e LIDARR_API_KEY=k -e DATA_DIR=/tmp helper-check python -c "import app"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Namen in Kleinbuchstaben
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/navidroid-helper" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: helper
          push: true
          tags: ${{ env.IMAGE }}:latest
