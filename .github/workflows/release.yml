name: Release

# Ein Tag wie "v1.2.0" baut eine signierte APK und veröffentlicht sie als GitHub-Release.
# Die App findet das Release über die GitHub-API und bietet es als Update an.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Keystore einrichten
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 fehlt – ohne festen Schlüssel lassen sich Updates nicht installieren (siehe README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "NAVIDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: APK bauen
        env:
          NAVIDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          NAVIDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          NAVIDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew --no-daemon assembleRelease \
            -PappVersionName="$VERSION" \
            -PappVersionCode="${{ github.run_number }}" \
            -PgithubRepo="${{ github.repository }}"
          cp app/build/outputs/apk/release/app-release.apk "navidroid-$VERSION.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: navidroid-*.apk
          generate_release_notes: true
