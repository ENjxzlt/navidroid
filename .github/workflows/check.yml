name: Check

# Kompiliert die App und führt die Tests aus – bei jedem Push außerhalb von main und bei Pull Requests,
# damit Fehler vor dem Release-Tag auffallen.
on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Kompilieren und testen
        run: ./gradlew --no-daemon :core:test :app:compileDebugKotlin

      - name: Helfer-Tests
        run: |
          pip install -q mutagen requests
          python3 helper/tests/test_matching.py
          python3 helper/tests/test_audiobooks.py
          python3 helper/tests/test_videos.py
